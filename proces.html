<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Process - My Doodle Garden</title>
    <link rel="stylesheet" href="assets/style/proces.css" />
  </head>

  <body>
    <header>
      <header></header>
      <!-- Bloem logo / figuur net als op 1b -->
      <figure>
        <img src="assets/images/doodlegarden.svg" alt="Bloem logo" />
      </figure>

      <h1>My doodle garden</h1>

      <!-- Navigatie met dezelfde knoppen als 1b -->
      <nav>
        <a href="index.html">Home</a>
        <a href="proces.html">Logboek</a>
        <a href="#">Story</a>
      </nav>
    </header>

    <main>
      <!-- Verborgen radiobuttons om bij te houden welke stap actief is -->
      <input type="radio" name="proces-stap" id="stap1" checked />
      <input type="radio" name="proces-stap" id="stap2" />
      <input type="radio" name="proces-stap" id="stap3" />
      <input type="radio" name="proces-stap" id="stap4" />
      <input type="radio" name="proces-stap" id="stap5" />

      <!-- De interactieve stappenlijn bovenin -->
      <nav class="stappen-nav">
        <label for="stap1">1</label>
        <label for="stap2">2</label>
        <label for="stap3">3</label>
        <label for="stap4">4</label>
        <label for="stap5">5</label>
      </nav>

      <!-- Het centrale werkblad -->
      <section>
        <!-- Inhoud Stap 1 -->
        <article>
          <h2>1. Schets</h2>
          <p>Komt nog tekst</p>
          <label for="stap2">Next</label>
        </article>

        <!-- Inhoud Stap 2 -->
        <article>
          <h2>2. Lineart</h2>
          <p>Komt nog tekst</p>
          <label for="stap3">Next</label>
        </article>

        <!-- Inhoud Stap 3 -->
        <article>
          <h2>3. Achtergrond</h2>
          <p>Komt nog tekst</p>
          <label for="stap4">Next</label>
        </article>

        <!-- Inhoud Stap 4 -->
        <article>
          <h2>4. Dikke lijnen</h2>
          <p>Komt nog tekst</p>
          <label for="stap5">Next</label>
        </article>

        <!-- Inhoud Stap 5 -->
        <article>
          <h2>5. Resultaat</h2>
          <p>Komt nog tekst</p>
          <label for="stap1">Terug</label>
        </article>

        <!-- Afbeeldingen per stap (standaard verborgen) -->
        <figure>
          <img src="assets/images/sketch1.jpg" alt="Idee fase" />
        </figure>
        <figure>
          <img src="assets/images/lineart.jpg" alt="Schets fase" />
        </figure>
        <figure>
          <img src="assets/images/lineart2.jpg" alt="Lineart fase" />
        </figure>
        <figure>
          <img src="assets/images/color.jpg" alt="Shading fase" />
        </figure>
        <figure>
          <img src="assets/images/final.jpg" alt="Eindresultaat" />
        </figure>
      </section>
    </main>

    <footer>&copy; 2026 My Doodle Garden</footer>
  </body>
</html>
